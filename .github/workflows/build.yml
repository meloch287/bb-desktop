name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
            script: build:win
          - os: macos-latest
            target: mac
            arch: arm64
            script: build:mac:arm64
          - os: macos-15-intel
            target: mac
            arch: x64
            script: build:mac:x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - name: Windows upgrade and native launch
        if: matrix.target == 'win'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Verify Mac signature
        if: matrix.target == 'mac'
        shell: bash
        run: |
          app_dir="dist/mac"
          if [ "${{ matrix.arch }}" = arm64 ]; then app_dir="dist/mac-arm64"; fi
          codesign --verify --deep --strict "$app_dir/bb.app"
      - uses: actions/upload-artifact@v4
        with:
          name: bb-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/bb-setup.exe
            dist/bb-setup.exe.blockmap
            dist/latest.yml
            dist/bb-mac-*.zip
            dist/mac/latest.json
            dist/SHA256SUMS-*.txt

  stage-release:
    needs: build
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bb-*
          merge-multiple: true
          path: release-assets
      - name: Stage verified installers in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          (cd release-assets && sha256sum -c SHA256SUMS-*.txt)
          mkdir staged-release
          cp release-assets/bb-setup.exe release-assets/bb-setup.exe.blockmap release-assets/latest.yml staged-release/
          for arch in arm64 x64; do
            file="bb-mac-$arch-$version.zip"
            cp "release-assets/$file" "staged-release/$file"
            cp "release-assets/$file" "staged-release/bb-mac-$arch.zip"
          done
          cp release-assets/mac/latest.json staged-release/latest-mac.json
          (cd staged-release && sha256sum * > SHA256SUMS.txt)
          if gh release view "$tag" --json isDraft > release-state.json; then
            test "$(node -p 'JSON.parse(require("fs").readFileSync("release-state.json")).isDraft')" = true
            gh release edit "$tag" --draft --target "$GITHUB_SHA" --title "bb $version" --notes-file RELEASE-NOTES.md
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "bb $version" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$tag" staged-release/* --clobber
